<!DOCTYPE html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/lalbaug_logo.png" />

      (function() {
        try {
          var theme = localStorage.getItem('lalbaug_theme_v1');

            document.documentElement.classList.add('dark');

        } catch (e) {}
      })();

  <body class="bg-[#FDFBF7] dark:bg-[#120F0D] text-[#2C180E] dark:text-[#F3ECE2] antialiased transition-colors duration-300">
